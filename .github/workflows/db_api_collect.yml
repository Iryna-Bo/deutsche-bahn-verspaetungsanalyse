name: DB API data collection

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
      timezone: "Europe/Berlin"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect DB API snapshot
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_CLIENT_SECRET: ${{ secrets.DB_CLIENT_SECRET }}
        run: python src/collect_db_data.py

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: db-api-snapshot-${{ github.run_id }}
          path: data/processed/api_current/*.parquet
          retention-days: 7
